<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusDesk · 403 Access Denied | TechNova Solutions</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="error-page-body">

  <div id="auth-lang-container" class="auth-lang-floating"></div>

  <div class="card error-card">
    <div class="error-icon-box error-icon-forbidden">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    </div>

    <div class="error-code">403</div>
    <h1 class="error-title">Restricted Access</h1>
    <p class="error-desc">
      You do not possess the required security role privileges to access this enterprise management resource.
    </p>

    <div class="error-actions">
      <a href="dashboard.html" class="btn btn-primary btn-lg">Return to Dashboard</a>
      <a href="login.html" class="btn btn-secondary btn-lg">Switch Account</a>
    </div>
  </div>

  <script src="../js/i18n.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('auth-lang-container');
      if (container && window.I18n) {
        container.appendChild(I18n.createLanguageSelector());
      }
    });
  </script>
</body>
</html>
