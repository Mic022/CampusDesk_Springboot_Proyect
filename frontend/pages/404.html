<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusDesk · 404 Page Not Found | TechNova Solutions</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="error-page-body">

  <div id="auth-lang-container" class="auth-lang-floating"></div>

  <div class="card error-card">
    <div class="error-icon-box error-icon-notfound">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    </div>

    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">
      The requested endpoint or page does not exist, has been removed, or is temporarily unavailable.
    </p>

    <div class="error-actions">
      <a href="dashboard.html" class="btn btn-primary btn-lg">Return to Dashboard</a>
      <a href="../index.html" class="btn btn-secondary btn-lg">CampusDesk Home</a>
    </div>
  </div>

  <script src="../js/i18n.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('auth-lang-container');
      if (container && window.I18n) {
        container.appendChild(I18n.createLanguageSelector());
      }
    });
  </script>
</body>
</html>
