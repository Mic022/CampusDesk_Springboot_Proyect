<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusDesk · Corporate Users Directory | TechNova Solutions</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand-wrapper">
          <div class="brand-icon-box">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          </div>
          <div>
            <span class="brand-title">CAMPUSDESK</span>
            <span class="brand-subtitle">TechNova</span>
          </div>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <a href="#" class="nav-link text-critical" id="sidebar-logout-btn"></a>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="top-header">
        <div class="header-left">
          <button id="menu-toggle" class="menu-toggle-btn" aria-label="Open sidebar menu">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div class="header-title-box">
            <h1 data-i18n="nav_users">User Accounts</h1>
            <p>Enterprise identity roster and role privileges</p>
          </div>
        </div>
        <div class="header-right">
          <!-- Mount points for i18n & notifications -->
          <div id="header-i18n-container"></div>
          <div id="header-notifications-mount"></div>

          <div class="user-profile-badge" id="header-user-profile" title="View Profile"></div>
        </div>
      </header>

      <main class="page-content">
        <div class="card">
          <div class="card-header">
            <h3 class="card-title" id="users-count-title">Corporate Accounts</h3>
            <div class="search-header-box">
              <input type="text" id="user-search-input" class="form-control form-control-sm" placeholder="Search accounts...">
            </div>
          </div>
          <div class="card-body card-body-flush">
            <div class="table-responsive">
              <table class="data-table responsive-cards-table">
                <thead>
                  <tr>
                    <th>Account ID</th>
                    <th>Full Name</th>
                    <th>Corporate Email</th>
                    <th>Role</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="users-table-rows">
                  <!-- Injected dynamically -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/i18n.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/navigation.js"></script>
  <script src="../js/pages/users.js"></script>
</body>
</html>
