# Dueño: Persona 1. Ningún valor secreto va escrito aquí: todo sale de variables de entorno.
# Al ejecutar desde la carpeta backend/, Spring lee también el archivo .env (copia de .env.example).

spring:
  application:
    name: campusdesk
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/campusdesk}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # update mientras se desarrolla; para la entrega se usa validate con database/schema.sql
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5500,http://localhost:5500}
  init:
    admin-email: ${ADMIN_EMAIL}
    admin-password: ${ADMIN_PASSWORD}
    technician-password: ${TECH_PASSWORD}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
