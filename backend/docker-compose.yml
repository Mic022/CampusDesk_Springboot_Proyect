# PostgreSQL para desarrollo local. Opcional: también sirve PostgreSQL instalado en el computador.
# Usuario y contraseña salen de backend/.env (Compose lo lee solo al ejecutarse desde backend/).
#
#   docker compose up -d       levanta la base
#   docker compose down        la detiene (los datos se conservan)
#   docker compose down -v     la borra; al volver a levantarla se ejecuta otra vez schema.sql
#
# database/schema.sql se ejecuta solo la primera vez que se crea el volumen.

services:
  postgres:
    image: postgres:17-alpine
    container_name: campusdesk-postgres
    environment:
      POSTGRES_DB: campusdesk
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - campusdesk-data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d campusdesk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  campusdesk-data:
